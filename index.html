<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Enhancer</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #0d0d0d; color: #ffffff; 
        }

        /* Fixed Top Header */
        .header { 
            padding: 16px; text-align: center; font-size: 20px; font-weight: 700; 
            border-bottom: 1px solid #222; background: #1a1a1a; letter-spacing: 0.5px;
            position: fixed; top: 0; left: 0; width: 100%; z-index: 10;
        }

        /* Scrollable Content Area */
        .content { 
            padding: 80px 24px 140px 24px; 
            display: flex; flex-direction: column; align-items: center; gap: 20px; 
            min-height: 100vh;
        }

        /* Image Upload Box */
        .upload-box { 
            width: 100%; max-width: 350px; aspect-ratio: 1; 
            border: 2px dashed #444; border-radius: 20px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: #888; position: relative; overflow: hidden; background: #141414; 
        }
        .upload-box img { 
            width: 100%; height: 100%; object-fit: contain; 
            display: none; position: absolute; z-index: 2; background: #000; 
        }
        .upload-box input { 
            position: absolute; width: 100%; height: 100%; 
            opacity: 0; cursor: pointer; z-index: 3; 
        }

        .status { font-size: 14px; color: #999; text-align: center; height: 20px; }

        /* Fixed Bottom Controls */
        .controls { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: #1a1a1a; border-top: 1px solid #222; 
            padding: 20px; padding-bottom: max(20px, env(safe-area-inset-bottom)); 
            z-index: 10;
        }

        .btn { 
            width: 100%; padding: 18px; border-radius: 16px; 
            background: #007aff; color: white; border: none; 
            font-size: 17px; font-weight: 600; 
            display: flex; justify-content: center; align-items: center; gap: 10px; 
            transition: 0.2s; 
        }
        .btn:active { transform: scale(0.96); opacity: 0.8; }
        .btn:disabled { background: #333; color: #666; }
        
        #downloadBtn { background: #34c759; display: none; margin-top: 12px; }

        .loader { 
            width: 22px; height: 22px; 
            border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; 
            border-radius: 50%; animation: spin 1s linear infinite; display: none; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">AI Enhancer</div>

    <div class="content">
        <div class="upload-box" id="dropArea">
            <div style="font-size: 40px; margin-bottom: 12px;">📸</div>
            <div style="font-weight: 500;">Tap to upload photo</div>
            <input type="file" id="fileInput" accept="image/*">
            <img id="previewImage" alt="Preview">
        </div>
        <div class="status" id="statusText">Awaiting Image...</div>
    </div>

    <div class="controls">
        <button class="btn" id="enhanceBtn" disabled>
            <div class="loader" id="spinner"></div>
            <span id="btnText">Auto Enhance</span>
        </button>
        <button class="btn" id="downloadBtn">📥 Save to Gallery</button>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');
        const enhanceBtn = document.getElementById('enhanceBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusText = document.getElementById('statusText');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btnText');

        let selectedFile = null;

        // Image ko Base64 URL mein convert karne ka function
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // Step 1: User ne photo select ki
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                previewImage.src = URL.createObjectURL(selectedFile);
                previewImage.style.display = 'block';
                enhanceBtn.disabled = false;
                downloadBtn.style.display = 'none';
                statusText.innerText = "Photo loaded. Ready to process.";
                btnText.innerText = "Auto Enhance";
            }
        });

        // Step 2: "Auto Enhance" button dabne par
        enhanceBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            enhanceBtn.disabled = true;
            spinner.style.display = 'block';
            btnText.innerText = "Processing...";
            statusText.innerText = "Converting image format...";

            try {
                const base64Img = await getBase64(selectedFile);
                
                statusText.innerText = "Sending to Super Computer...";

                // PURE REST API CALL - Direct to your Hugging Face space
                const response = await fetch("https://praveenpandeyy-bolbytes-image.hf.space/api/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ data: [base64Img] })
                });

                if (!response.ok) {
                    throw new Error("Engine is sleeping or busy. Code: " + response.status);
                }

                statusText.innerText = "AI has completed the operation...";
                const result = await response.json();

                let outputData = result.data[0];
                
                if (typeof outputData === 'string') {
                    previewImage.src = outputData; 
                } else if (typeof outputData === 'object' && outputData.url) {
                    previewImage.src = outputData.url; 
                } else {
                    throw new Error("Engine sent invalid image format");
                }
                
                statusText.innerText = "Success! Photo enhanced.";
                
                enhanceBtn.style.display = 'none';
                downloadBtn.style.display = 'flex'; 
                
                downloadBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = previewImage.src;
                    a.download = "Bolbytes_Enhanced.png";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    
                    enhanceBtn.style.display = 'flex';
                    downloadBtn.style.display = 'none';
                    enhanceBtn.disabled = false;
                    btnText.innerText = "Enhance Another";
                };

            } catch (error) {
                console.error(error);
                alert("Error aa gaya: " + error.message);
                statusText.innerText = "Task Failed. Please try again.";
            } finally {
                spinner.style.display = 'none';
                if(enhanceBtn.style.display !== 'none') {
                    enhanceBtn.disabled = false;
                    btnText.innerText = "Try Again";
                }
            }
        });
    </script>
</body>
</html>
